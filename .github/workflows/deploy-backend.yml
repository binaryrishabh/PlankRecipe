name: Deploy Backend to AWS

on:
  push:
    branches: [main]
    paths:
      - "Backend/**"
      - "shared/**"
      - ".github/workflows/deploy-backend.yml"

jobs:
  deploy:
    name: SSH deploy to EC2
    runs-on: ubuntu-latest
    steps:
      - name: Pull latest code and restart the service
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -e
            # add bun and the exact nvm node/pm2 path so the non-interactive session can find them
            export PATH="$HOME/.bun/bin:/home/ubuntu/.nvm/versions/node/v24.13.0/bin:$PATH"
            cd /home/ubuntu/PlankRecipe
            git pull origin main
            cd Backend
            bun install
            bunx prisma generate
            pm2 restart plank-backend --update-env
            sleep 3
            curl -fsS http://localhost:3000/health
            echo "[deploy] backend is healthy and back up"