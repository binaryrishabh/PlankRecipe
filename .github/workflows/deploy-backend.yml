name: Deploy Backend

on:
  push:
    branches:
      - main
    paths:
      - 'apps/backend/**'
      - 'packages/shared/**'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            # Export PATH so node/bun/pm2 can be found by child processes
            export PATH=/home/ubuntu/.bun/bin:/home/ubuntu/.nvm/versions/node/v24.13.0/bin:$PATH
            
            cd /home/ubuntu/PlankRecipe
            
            # Force reset to match GitHub exactly
            git fetch origin
            git reset --hard origin/main
            
            # One-time migration from the old layout: carry the untracked .env over
            if [ -f Backend/.env ] && [ ! -f apps/backend/.env ]; then
              cp Backend/.env apps/backend/.env
            fi

            # Install all workspace dependencies from the repo root (single bun.lock)
            /home/ubuntu/.bun/bin/bun install

            cd apps/backend

            # Generate Prisma client
            /home/ubuntu/.bun/bin/bunx prisma generate

            # Recreate the PM2 process so its working directory is apps/backend
            /home/ubuntu/.nvm/versions/node/v24.13.0/bin/pm2 delete plank-backend || true
            /home/ubuntu/.nvm/versions/node/v24.13.0/bin/pm2 start /home/ubuntu/.bun/bin/bun --name plank-backend --cwd /home/ubuntu/PlankRecipe/apps/backend -- index.ts
            /home/ubuntu/.nvm/versions/node/v24.13.0/bin/pm2 save
            
            # Health check
            sleep 3
            curl -f http://localhost:3000/health || exit 1