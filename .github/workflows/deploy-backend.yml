name: Deploy Backend

on:
  push:
    branches:
      - main
    paths:
      - 'apps/backend/**'
      - 'packages/shared/**'
      - 'package.json'
      - 'bun.lock'
      - '.github/workflows/deploy-backend.yml'
  workflow_dispatch:

# never run two deploys against the server at the same time
concurrency:
  group: deploy-backend
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # the home server is only reachable over Tailscale, so the runner joins
      # the tailnet temporarily as tag:allrecipes-ci (ephemeral node)
      - name: Connect to Tailscale
        uses: tailscale/github-action@v3
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:allrecipes-ci

      - name: Deploy to home server
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          fingerprint: ${{ secrets.EC2_HOST_FINGERPRINT }}
          command_timeout: 15m
          script_stop: true
          script: |
            set -euo pipefail
            cd /home/ubuntu/allrecipes

            # match GitHub main exactly — the server is never edited by hand
            git fetch origin main
            git reset --hard origin/main
            echo "Deploying $(git log --oneline -1)"

            # workspace install from the repo root (single bun.lock)
            bun install --frozen-lockfile

            # generate the Prisma client and apply pending migrations.
            # secrets live in /etc/allrecipes/app.env (root, 600), so run the
            # migration through systemd with that env file instead of reading it here
            cd apps/backend
            bun x prisma generate
            sudo systemd-run --quiet --pipe --wait --collect \
              -p User=ubuntu \
              -p EnvironmentFile=/etc/allrecipes/app.env \
              -p WorkingDirectory=/home/ubuntu/allrecipes/apps/backend \
              /usr/local/bin/bun x prisma migrate deploy

            sudo systemctl restart allrecipes.service

            # health checks: app up, then database reachable
            for i in $(seq 1 15); do
              if curl -fsS http://127.0.0.1:5710/health >/dev/null; then break; fi
              sleep 2
            done
            curl -fsS http://127.0.0.1:5710/health
            echo
            curl -fsS -m 30 http://127.0.0.1:5710/health/db
            echo
