name: Deploy Backend

on:
  push:
    branches:
      - main
    paths:
      - 'Backend/**'
      - 'shared/**'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd /home/ubuntu/PlankRecipe
            
            # Force reset to match GitHub exactly
            git fetch origin
            git reset --hard origin/main
            
            cd Backend
            
            # Use absolute paths since SSH action doesn't load shell profile
            /home/ubuntu/.bun/bin/bun install
            /home/ubuntu/.bun/bin/bunx prisma generate
            
            # Restart or start PM2 with absolute paths
            /home/ubuntu/.nvm/versions/node/v24.13.0/bin/pm2 restart plank-backend || /home/ubuntu/.nvm/versions/node/v24.13.0/bin/pm2 start /home/ubuntu/.bun/bin/bun --name plank-backend -- index.ts
            /home/ubuntu/.nvm/versions/node/v24.13.0/bin/pm2 save
            
            # Health check
            sleep 3
            curl -f http://localhost:3000/health || exit 1